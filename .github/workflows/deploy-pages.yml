# ============================================================================
# 部署到 GitHub Pages
#
# 本仓库是纯静态站点,没有构建步骤,因此这里只做「打包上传 → 发布」两件事。
#
# 首次启用(只需一次,必须由仓库所有者在网页上操作):
#   Settings → Pages → Build and deployment → Source 选「GitHub Actions」
#   之后每次推送到 main 都会自动重新发布。
#
# 若不想用工作流,也可在同一个页面把 Source 改为
#   「Deploy from a branch」→ 分支 main、目录 / (root)
# 二者效果相同,选其一即可。
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许工作流读取仓库内容并向 Pages 发布
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署;不取消进行中的发布,避免站点处于半更新状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验正文校勘
        run: python3 docs/verify_text.py

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点根目录。templates/ 与 docs/ 为开发用,一并上传无妨
          path: .

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
