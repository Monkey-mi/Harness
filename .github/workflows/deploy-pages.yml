# ============================================================================
# 部署到 GitHub Pages(含自动启用尝试)
#
# 本仓库是纯静态站点,没有构建步骤,这里只做「启用 Pages → 打包 → 发布」。
#
# configure-pages 的 enablement: true 会在 Pages 尚未启用时尝试自动创建站点,
# 因而需要 administration: write 权限(GITHUB_TOKEN 可申请,不使用 PAT)。
#
# 若本工作流持续失败,请改用手动方式(更省事):
#   Settings → Pages → Source 选「Deploy from a branch」→ main + / (root)
# 二者效果相同。
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校勘正文(不通过则中止部署)
        run: python3 docs/verify_text.py

      - name: 配置并尝试启用 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
